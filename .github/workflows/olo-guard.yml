name: Olo Guard

# NOTE: This workflow will NOT run while GitHub Actions is disabled on this
# repository (see docs/olo/README.md §CI). The same checks run locally via
# scripts/olo/check_core_diff.sh and in tests/olo/test_core_guard.py.
# Enabling Actions is BBC's decision.

on:
  pull_request:
    branches: ["main", "olo/**"]
  push:
    branches: ["main", "olo/**"]

jobs:
  olo-guard:
    name: Olo core-diff guard + tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history + tags)
        # Pinned to full commit SHA per Hermes policy (F17) and §4.3.
        # Resolved from actions/checkout tag v4.2.2 via:
        #   gh api repos/actions/checkout/git/refs/tags/v4.2.2 --jq '.object.sha'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run core-diff guard
        run: bash scripts/olo/check_core_diff.sh

      - name: Build test environment
        run: python -m pm.build_env --source . --out .venv-test --group dev --group test

      - name: Run Olo tests
        run: |
          export HERMES_HOME="$(mktemp -d)/hermes-home"
          export HERMES_RUNTIME_DIR="$(mktemp -d)/hermes-runtime"
          export HERMES_PYTHON="$(pwd)/.venv-test/bin/python"
          scripts/run_tests.sh tests/olo/
